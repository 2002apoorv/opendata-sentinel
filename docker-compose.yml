version: '3.8'

services:
  opendata-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: opendata-sentinel:latest
    container_name: opendata-sentinel-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - sentinel-data:/app/data
    restart: unless-stopped

volumes:
  sentinel-data:
